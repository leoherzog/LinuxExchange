name: File Sizes Updater

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

# Shared with distros-updater.yml so only one job writes distros.db at a time.
concurrency:
  group: catalog-db
  queue: max

jobs:

  update-file-sizes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        # A queued run would otherwise check out the commit that triggered it and fail to push.
        ref: ${{ github.ref }}
    - name: Get Node
      uses: actions/setup-node@v7
      with:
        node-version: latest
    - name: Configure Git
      run: git config --global user.name "Leo Herzog" && git config --global user.email "xd1936@gmail.com"
    - name: Add missing file sizes
      run: node .github/update-file-sizes.js
    - name: Add, Commit, and Push
      run: git add distros.db && git commit -m "Add Missing File Sizes" && git push || echo "No changes"
